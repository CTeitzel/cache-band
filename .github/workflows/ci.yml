name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The engine the tests run against; keep it at the version the mod is developed on.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.289

      # Warnings fail the build as well as errors.
      - name: Validate plugin and marketplace
        run: |
          set -o pipefail
          for target in . .claude-plugin/marketplace.json; do
            claude plugin validate "$target" 2>&1 | tee validate.log
            if grep -q '⚠' validate.log; then
              echo "::error::claude plugin validate $target reported warnings"
              exit 1
            fi
          done

      - name: Tests
        run: claude plugin test .
